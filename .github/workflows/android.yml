name: Build TV Launcher Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The TV_KEYSTORE_B64 repository secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/tv-launcher.keystore
          keytool -list -keystore app/tv-launcher.keystore -storepass android | grep -i sha

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
